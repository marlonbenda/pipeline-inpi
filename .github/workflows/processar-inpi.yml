name: Pipeline INPI Marcas para BigQuery

on:
  schedule:
    # Roda toda quarta-feira às 3h00 da manhã (horário UTC)
    - cron: '0 3 * * 3'
  workflow_dispatch: # Permite rodar manualmente pelo botão no GitHub

jobs:
  etl_inpi:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Clonar o repositório
      uses: actions/checkout@v4

    - name: 2. Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. Criar o arquivo seguro do GCP
      run: |
        echo '${{ secrets.GCP_CREDENTIALS }}' > gcp_key.json

    - name: 5. Executar o Pipeline
      env:
        GOOGLE_APPLICATION_CREDENTIALS: "gcp_key.json"
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python src/processar_marcas.py