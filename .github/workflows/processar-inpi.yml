name: Pipeline INPI Marcas para BigQuery

on:
  schedule:
    # Roda toda segunda-feira às 3h00 da manhã (horário UTC)
    - cron: '0 3 * * 1' 
  workflow_dispatch: # Esse comando cria um botão no GitHub para você rodar o script manualmente quando quiser testar

jobs:
  etl_inpi:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Clonar o repositório
      uses: actions/checkout@v3

    - name: 2. Configurar o Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 3. Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. Criar o arquivo seguro do GCP
      run: |
        echo '${{ secrets.GCP_CREDENTIALS }}' > gcp_key.json

    - name: 5. Executar o Pipeline
      env:
        # Avisa o Python onde está o arquivo de credenciais que acabamos de criar no passo 4
        GOOGLE_APPLICATION_CREDENTIALS: "gcp_key.json"
      run: python src/processar_marcas.py